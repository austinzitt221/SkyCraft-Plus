; SkyCraft: Skyrim with Minecraft physics, inventory and blocks.
; Goes in Data\SKSE\Plugins\ next to SkyCraft.dll.

[Minecraft]
; Start Minecraft when Skyrim starts. It stays hidden (no window, no music), opens its SkyCraft world
; by itself once you're in game, and quits when Skyrim closes. 0 = start Minecraft yourself.
bStartWithSkyrim = 1

; Empty: the Minecraft that comes with SkyCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\SkyCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file) to use that instead.
sLauncher =

; What to pass to your own launcher. For Prism: --launch and the SkyCraft instance's folder name.
sArguments = --launch SkyCraft

[Controls]
; Extra keys that go to Skyrim instead of Minecraft, so Skyrim's own menus open while Minecraft
; drives the player: Tab (Skyrim's menu: skills, level up, map, items, magic), I (inventory),
; P (magic). They open whatever Skyrim binds them to. Letters, digits, F1-F12, Tab, or a scan
; code like 0x0F, separated by commas. Empty: only Esc, ~, J, M and F9 go to Skyrim.
; (In Minecraft, Tab is the player list and P the social screen; both only matter in multiplayer.)
sSkyrimMenuKeys = Tab, I, P

; Switches between Minecraft mode and Skyrim mode: Skyrim's own movement, body, HUD, weapons and
; magic. Minecraft's player follows you meanwhile and can't be hurt; your blocks stay. Health is
; carried across as a share (half your Skyrim health becomes half your Minecraft hearts). Same key
; names as above (pick one neither game uses; K is free in both by default). Empty: no switch.
sModeToggleKey = K

; The key that switches between Minecraft's controls and Skyrim's own. In Skyrim's mode you move,
; look, fight and use Skyrim's inventory, magic, shouts and perks as in plain Skyrim, with no
; Minecraft HUD over Skyrim's (Minecraft's blocks and mobs still there), and Minecraft's player just follows yours. Press the
; key again to go back to Minecraft. SkyCraft keeps this key to itself in both modes, so pick one
; Minecraft doesn't need. If this is empty, SkyCraft+'s sModeToggleKey above is used instead.
; A key name (F1-F12, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock) or a
; DirectInput scan code (66 or 0x42). Esc, ~, G, H, J, M, O and F9 are already used.
sToggleKey =

; 1: start every session, and every save you load, with Skyrim's controls (switch to Minecraft's
; with the key above). Handy for playing through Skyrim's scripted opening, then switching over.
; 0 (the default): start with Minecraft's controls.
bStartInSkyrimMode = 0

; A controller (Xbox layout) plays Minecraft mode too, laid out like console Minecraft: left stick
; move (click: sprint), right stick look, RT attack/break, LT use/place, A jump, B sneak,
; X Skyrim activate, Y Minecraft inventory, LB/RB hotbar, LB+RB together shout, D-pad up
; Minecraft camera, right Skyrim's menu (items, magic, map, skills), down Minecraft's pause menu,
; left drop; Start and Back stay Skyrim's. Clicking the right stick switches
; modes. In Minecraft screens the sticks move the cursor: A click, X right-click, Y move a stack,
; B close. 0 = the controller only works in Skyrim mode.
bController = 1
; In Minecraft inventories, chests and the like the D-pad and left stick jump slot to slot (as on
; console Minecraft); the right stick stays a free cursor for buttons, tabs and the recipe book.
; 0 = both sticks move a free cursor.
bControllerSlots = 1
; G (controller X) when Skyrim's crosshair has nothing (no prompt): activate the nearest door, person,
; container, lever or item straight ahead within 3 blocks instead. 0 = only what Skyrim's crosshair finds.
bActivateInView = 1

; Mix and match hands in Minecraft mode: equip a Skyrim weapon, spell, shield or torch in a hand
; (Skyrim's inventory or magic menu) and that hand becomes Skyrim's until you unequip it. Skyrim
; draws it and gets its mouse button (left button: right hand, right button: left hand); the other
; hand stays Minecraft's. Two-handed weapons and bows take both hands. 0 = Minecraft keeps both.
; Who wins a hand holding both a Skyrim and a Minecraft item: the "Hands" button in Minecraft's
; pause menu.
bSkyrimHands = 1

; Riding Skyrim's horses: in Skyrim's third-person riding camera you see your Minecraft player on the
; saddle (Skyrim's body is hidden), and Minecraft's first-person hands aren't drawn while Skyrim has
; the player. 0 = Skyrim's own body rides (the hands are still hidden).
bRideAsMinecraft = 1

; Skyrim footsteps while Minecraft walks: your boots' footstep sounds on the ground under you, and the
; noise enemies hear (sneaking is silent, Muffle works). 0 = none (Skyrim's enemies can't hear you walk).
bMinecraftFootsteps = 1

; Skyrim's animals follow you while you hold the Minecraft food they like, as Minecraft's do:
; chickens seeds; cows, goats, deer and elk wheat; hares carrots; horses apples and golden carrots;
; foxes berries; dogs bones and meat; mudcrabs fish; boars beetroot. 0 = they don't.
bAnimalsFollowFood = 1

[Collision]
; Skyrim's mode: Minecraft's blocks get real collision for everything in Skyrim (you, NPCs, arrows, spells), over the whole area Minecraft
; has sent. Each section of blocks is written as a small collision-only model (Data/Meshes/SkyCraft/BlockCollision, cleared at every start) of
; merged boxes and put in the world as an invisible static, so Skyrim's own loader makes the collision. If the models can't be made or load
; without collision on your install, SkyCraft.log says so and the block crates below hold you up instead. 0 = crates only.
bBlockMesh = 1

; On by default: the section collision models are loaded, with the layout that matches Skyrim's own statics (patch revisions 30-32). The block
; crates below stay under you until a model has been seen working in Skyrim's Havok world (SkyCraft.log says "works"), so there is always something
; to stand on. If Skyrim ever crashes while loading them, the last "Block collision test: LOADING" line in SkyCraft.log names the file; set this to 0
; to go back to crates only (a copy of some vanilla models is then made in Data/Meshes/SkyCraft/vanilla_dump to learn their layout).
bBlockMeshExperimental = 1

; The shape library: slabs, stairs, fences, doors and the other blocks that aren't whole cubes. Minecraft writes a catalogue of every distinct
; collision shape (skycraft/shape_catalog.json in its folder) the first time its world starts, and at plugin load SkyCraft makes a model for
; each into Data/Meshes/SkyCraft/BlockLibrary, which Skyrim has from its start. A block of such a shape is then a reference to its model
; instead of boxes in the section's model, so changing one doesn't rewrite the section. Used once a section model has been seen working;
; anything not in the library stays in the section models. The first session after installing has no catalogue yet, so it starts at the second.
; 0 = odd shapes always in the section models.
bShapeLibrary = 1

; Where the catalogue is. Empty: where the Minecraft that comes with SkyCraft writes it (%LOCALAPPDATA%\SkyCraft\Prism\instances\SkyCraft\.minecraft\skycraft),
; or Data\SKSE\Plugins\SkyCraft\shape_catalog.json. Set the full path of the file if you use your own launcher.
sShapeCatalog =

; The most library references at once (0 switches the library off).
iMaxShapeRefs = 600

; How many sections (16 blocks each) round you, sideways, get a model (1-8), and the most models at once.
iRadius = 4
iMaxMeshes = 220

; How much wider than a block the boxes are (a fraction), so boxes that meet leave no seam to catch a foot on.
fOverlap = 0.02

; Havok material of the blocks (their footsteps and impact sounds): 3741512247 is stone.
sMaterial = 3741512247

; Walking up steps like Minecraft: in Skyrim's mode, walking into a block (a stair, a slab, a carpet) no higher than fStepHeight (blocks; Minecraft's
; own is 0.6) lifts you onto it without a jump. fStepRadius is how wide your body is from its middle (0: measured from the body Skyrim collides
; with, about 0.44 for Skyrim's own), and fStepReach how far beyond it a step is looked for;
; if you still stop at a stair, raise fStepReach a little (0.2); if you are lifted before you touch it, lower it. SkyCraft.log says "Step up: ..." each time
; (the first twelve).
bStepUp = 1
fStepHeight = 0.6
fStepRadius = 0
fStepReach = 0.14

; The block crates round you (see [Crates]) are kept until a section model has been seen working on your install (its collision in Skyrim's
; Havok world; SkyCraft.log says "works"), so there is always something to stand on. 1 = keep them even then.
bCratesWithMesh = 0

[Crates]
; Skyrim's mode: Minecraft's blocks are real, invisible crates put on the solid blocks around you, so Skyrim's own character controller
; stands, walks, steps, jumps and bumps on them like on any crate in the game. There is no other block collision for your character: with
; this off you fall through every block you place.
bBlockCrates = 1

; The base form of the crate: hex, as the console shows it (click a crate, read its base ID). Each is scaled to one block
; (its narrower side, plus fOverlap), its top set on the block's top. SkyCraft.log says what size it measured.
sBaseForm = 0x0007A617

; How many blocks around you (1-8) get crates.
iRange = 5

; How much wider than a block each crate is (0.05 = 5%), so neighbours overlap and there is no seam to catch your feet on.
fOverlap = 0.05

; Blocks to set the crates' tops below the top of their block (negative: above), to tune how the ground feels.
fSink = 0.0

[LockOn]
; Skyrim's mode: Minecraft's mobs (passive ones too) are handed to True Directional Movement as lock-on targets (they have no Skyrim actor to lock
; on to). Needs the TrueDirectionalMovement.dll built with TrueDirectionalMovement-VirtualTargets.patch; with any other TDM this does
; nothing and the log says so. 0 = off.
bLockOnMobs = 1

; How high up a mob's body the camera and your character face when locked on, as a fraction of its height.
fAimHeight = 0.6

; How far, in blocks, a mob can be and still be offered for lock-on (TDM's own lock-on distance applies as well).
fRange = 40

[Worlds]
; The Nether and the End: a Minecraft portal takes you into Minecraft's own world. Skyrim keeps its
; player waiting in an empty cell meanwhile and draws only Minecraft, then brings you back to Skyrim
; wherever you come out of a portal. 0 = Skyrim stays where it was (not playable there).
bMinecraftWorlds = 1

; The empty cell Skyrim waits in (a form ID in Skyrim.esm). MainMenuCell holds nothing but a marker.
iWaitingCell = 0x6F3EB

; Skyrim's enemies in the Nether, and out among the End's outer islands (its cities), now and then
; around you, picked to your level by Skyrim's leveled lists. 0 = none.
bSkyrimEnemies = 1

; Which (form IDs in Skyrim.esm, leveled lists or actors). Nether: Dremora (melee, archers,
; warlocks), flame atronachs, skeletons, hagravens, vampires. End: frost and storm atronachs,
; wispmothers, ice wraiths, Dwarven centurions, spiders and spheres.
sNetherEnemies = 0x1E79B, 0x25D1A, 0x25D1B, 0x23AA6, 0x2D2D4, 0x23AB0, 0x33973
sEndEnemies = 0x23AA7, 0x23ABD, 0x10FCE5, 0x10EC90, 0x10EC8F, 0x23AA8, 0x23AB3

; At most this many alive at once, a new one tried about this often (seconds).
iEnemyCap = 6
fEnemySeconds = 12

; Killing the Ender Dragon gives you a dragon soul, like slaying one of Skyrim's dragons (the message
; shows once you're back in Skyrim). 0 = no soul.
bEnderDragonSoul = 1

; Minecraft loot chests in Skyrim's dungeons, caves and camps: one beside the boss chest and one partway in,
; each on a little Minecraft ground, with better loot the higher the dungeon's level. 0 = none (ones
; already placed stay).
bLootChests = 1

; Minecraft's structures in Skyrim's open world (villages, outposts, temples, wrecks...) on Skyrim's map
; and compass, with Skyrim's own icons, and you can fast travel to them. Not marked: the woodland
; mansion and anything underground. 0 = no markers (ones already in a save stay).
bStructureMarkers = 1

; In the Nether and the End, Minecraft's blocks are drawn before Skyrim's effects (spells, fire), so
; the effects show in front of them. If the Nether or the End looks wrong, set 0 (effects then don't show there).
bBlocksBeforeEffects = 1

; In the Nether and the End, Skyrim's ambient occlusion is off (Skyrim treats them as an interior
; and its occlusion put dark, crawling blotches on seas of lava and the End's island). 0 = left on.
bNoAmbientOcclusionAway = 1

; Deep underground (24 blocks and more under Skyrim's land) Skyrim's buildings, rocks, trees and
; distant land aren't drawn, as none of it can be seen from down there: much faster in big caves.
; If something of Skyrim's goes missing that shouldn't, set 0.
bHideWorldDeep = 1

; Under Skyrim's land (a mine, a tunnel, a cave you dug), Minecraft's blocks are lit the way
; Minecraft lights them: torches as bright as in Minecraft, daylight down open shafts, and never
; quite pitch black, instead of by Skyrim's light. 0 = Skyrim's light everywhere.
bMinecraftLightUnderground = 1

; How far round you Skyrim tells Minecraft where its ground is, in eight-block steps (7 = 56 blocks).
; Minecraft's patches of grass, flowers and trees go only where it knows the ground, so further out
; they're there before you come near. Lower (5 was the old distance) if Skyrim runs slower with it.
iGroundRegions = 7

[Combat]
; The most of Minecraft's health one Skyrim hit can take while Minecraft drives (20 is all of it,
; 2 per heart): Skyrim's spells hit far harder than Minecraft's mobs at low levels. 0 = no cap.
fMaxHitHealth = 10

; Skyrim food and stamina potions fill Minecraft's hunger bar too (food by how much it restores, a
; stamina potion by its stamina: a Minor one a drumstick, an Ultimate one most of the bar). 0 = they don't.
bSkyrimFoodFeeds = 1

; How hard Minecraft's weapons hit Skyrim's people and creatures: each point of Minecraft damage is
; worth fMinecraftDamage of Skyrim's, plus fMinecraftDamagePerLevel for each of the target's levels
; (so gear keeps up with tougher enemies). An iron sword (6) on a level 10 bandit: about 22. Before
; this setting it was 5 and 0.25 (about 45). Lava and fire on them aren't changed by this.
fMinecraftDamage = 2.5
fMinecraftDamagePerLevel = 0.125

; Skyrim's weapons do this much more to Minecraft's mobs than a matching Minecraft weapon would
; (1 = the same; an iron sword at low skill is about a Minecraft iron sword's 6).
fSkyrimWeaponsVsMinecraft = 1.5

; Minecraft's attacks also hit Skyrim's breakable things in front of you (spider webs and the
; like), which Minecraft doesn't know are there. 0 = only in Skyrim mode, with Skyrim's weapons.
bMinecraftHitsObjects = 1

[Debug]
; Detailed timing, camera, combat and lighting logs in SkyCraft.log (several lines a second), for
; reporting problems. 0 = off.
bDiagnostics = 0
